[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-memory"
version = "0.1.0"
description = "A personal Telegram memory, task, and reminder assistant"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10,<4",
  "fastapi>=0.115",
  "langchain>=1.0",
  "langchain-core>=0.3",
  "langchain-google-genai>=2.0",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "python-telegram-bot>=21.10",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
